<style>

  justify-content:center;
  animation:hideLoader 0.5s ease forwards;

}

}

}

@keyframes loaderPulse{

    transform:scale(1);
    opacity:1;
  }
  50%{
    transform:scale(1.08);
    opacity:.7;
  }
}

@keyframes hideLoader{
  0%{
    opacity:1;
    visibility:visible;
  }
  99%{

    visibility:visible;

  100%{
    opacity:0;
    visibility:hidden;
